name: Build & Release Windows Desktop App & MSIX Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt (Visual Studio 2022)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Unit & Model Tests (skip widget/integration tests needing native)
        run: flutter test test/filter_graph_builder_test.dart test/project_model_test.dart

      - name: Download Prebuilt FFmpeg Static Binaries (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets/bin"
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip" -UseBasicParsing
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          Copy-Item -Path "ffmpeg_extracted/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "assets/bin/ffmpeg.exe" -Force
          Copy-Item -Path "ffmpeg_extracted/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -Destination "assets/bin/ffprobe.exe" -Force
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_extracted"
          Write-Host "FFmpeg downloaded successfully:"
          Get-Item "assets/bin/ffmpeg.exe" | Select-Object Name, Length

      - name: Build Windows Desktop Release Executable
        run: flutter build windows --release

      - name: Bundle FFmpeg into Windows Release Directory
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$releaseDir/assets/bin"
          Copy-Item -Path "assets/bin/ffmpeg.exe" -Destination "$releaseDir/assets/bin/ffmpeg.exe" -Force
          Copy-Item -Path "assets/bin/ffprobe.exe" -Destination "$releaseDir/assets/bin/ffprobe.exe" -Force
          Write-Host "Release directory contents:"
          Get-ChildItem -Recurse "$releaseDir" | Select-Object FullName

      - name: Build MSIX Package for Microsoft Store
        run: dart run msix:create
        
      - name: Get Version for Artifact
        id: get_version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match 'refs/tags/(v[^/]+)') { $matches[1] } else { 'dev' }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Build Artifact (MSIX Package)
        uses: actions/upload-artifact@v4
        with:
          name: Z-Movie-Maker-${{ env.VERSION }}-Windows-MSIX
          path: build/windows/x64/runner/Release/*.msix
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/x64/runner/Release/*.msix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
