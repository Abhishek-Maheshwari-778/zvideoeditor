name: Build & Release Windows Desktop App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Z-Movie Maker Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Download & Bundle FFmpeg Static Binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "assets/bin"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Copy-Item -Path "ffmpeg_extracted/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "assets/bin/ffmpeg.exe"
          Copy-Item -Path "ffmpeg_extracted/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -Destination "assets/bin/ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_extracted"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Windows Desktop Release Executable
        run: flutter build windows --release

      - name: Copy FFmpeg Binaries into Output Bundle
        shell: powershell
        run: |
          Copy-Item -Path "assets/bin/*" -Destination "build/windows/x64/runner/Release/"

      - name: Package Standalone Portable Zip
        shell: powershell
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Z-Movie-Maker-Windows-Portable.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-Movie-Maker-Windows-Portable
          path: Z-Movie-Maker-Windows-Portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Z-Movie-Maker-Windows-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
